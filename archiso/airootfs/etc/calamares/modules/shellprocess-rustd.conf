i18n:
     name: "Configuring RustD services"
dontChroot: false
timeout: 60
script:
    - "-/usr/bin/rustctl --root=/ enable NetworkManager.service rustd-journald.service rustd-tmpfiles-setup-dev.service rustd-udevd.service rustd-udev-trigger.service rustd-udev-settle.service dbus.service rustd-resolved.service rustd-logind.service rustd-user-sessions.service tuned-rs.service tuned-rs-ppd.service libinput-rs-elan-resume.service hermes-gpu.service"
    - "-if grep -q '^hosts:' /etc/nsswitch.conf; then sed -i -E 's/^hosts:.*/hosts: files rustd_dns [!UNAVAIL=return] dns/' /etc/nsswitch.conf; else printf 'hosts: files rustd_dns [!UNAVAIL=return] dns\n' >> /etc/nsswitch.conf; fi"
    - "-install -d -m 0755 /etc/rustd/system /run/rustd/resolve 2>/dev/null || true"
    - "-ln -sfn /run/rustd/resolve/stub-resolv.conf /etc/resolv.conf"
