---
# Unpack only the ArachOS live root. The measured Arach Kernel and RustD
# payloads are installed by the dedicated boot-contract step; the stock
# Calamares profile must not copy a distribution vmlinuz or initramfs.
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
