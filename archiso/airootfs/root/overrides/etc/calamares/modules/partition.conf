# ArachOS Calamares Partition Module Configuration
efiSystemPartition:     "/boot/efi"
userSwapChoices:        [none, small, suspend, file]
drawNestedPartitions:   true
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
initialPartitioningName: "ArachOS"
defaultFileSystemType:  "ext4"

# Offer the filesystem types whose format and mount tools are in this image.
availableFileSystemTypes:  ["ext4", "xfs", "btrfs", "f2fs", "jfs", "ntfs", "exfat"]
