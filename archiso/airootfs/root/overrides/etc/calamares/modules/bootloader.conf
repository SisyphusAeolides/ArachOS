# ArachOS Calamares Bootloader Configuration
efiBootLoader: "grub"
kernel: "/boot/arach"
img: "/boot/rustd"
fallback: "/boot/rustd-resolved"
timeout: "10"
bootloaderEntryName: "ArachOS"

# Arach-Kernel strictly requires a Multiboot2 compliant bootloader.
# GRUB is currently the only supported target for arach-kernel-install,
# but we provide the configuration structure to support others if expanded.
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
installEFIFallback: true
