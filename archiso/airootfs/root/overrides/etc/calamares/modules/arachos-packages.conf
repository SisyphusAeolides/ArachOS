# ArachOS package transactions are performed by Corinth inside the mounted
# target root. Corinth authenticates the service, provider registry, and every
# selected package before it changes the target.
corinth:
    executable: /usr/bin/corinth
    service-config: /etc/corinth/service.toml
    service-signature: /etc/corinth/service.toml.sig
    keyring: /etc/arach/hwd/keys.toml
    offline: false
    update-system: false
operations: []
